# Integración continua del taller. Los servidores de GitHub no tienen tarjeta de video,
# y el taller entrena siempre en una (ver docs/arquitectura.md), así que este flujo
# excluye con `pytest -m "not gpu"` las pruebas que la necesitan. Esas pruebas corren
# en una máquina con tarjeta de video o dentro de Docker (ver la sección Docker del README).
name: pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest -m "not gpu" -W error
